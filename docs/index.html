<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Switzerland's Water Pulse</title>
    <meta
      name="description"
      content="Every river in Switzerland, every day of 2025. Scrub the year, pick a date, or ask the film what the water was doing."
    />
    <meta property="og:title" content="Switzerland's Water Pulse" />
    <meta
      property="og:description"
      content="Every river in Switzerland, every day of 2025. Ribbon width follows discharge. Colour is the river against its own normal."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alexanderduckworthhu.github.io/swiss-water-pulse/" />
    <meta property="og:image" content="https://alexanderduckworthhu.github.io/swiss-water-pulse/poster.jpg" />
    <link rel="canonical" href="https://alexanderduckworthhu.github.io/swiss-water-pulse/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;1,400&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;1,8..60,500&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=6" />
  </head>
  <body class="film-page">
    <header class="top">
      <a class="brand" href="./">Switzerland's <strong>Water Pulse</strong></a>
      <nav class="site-nav" aria-label="Pages">
        <a href="./" aria-current="page">Pulse</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <main class="pulse">
      <div class="stage">
        <video id="film" poster="poster.jpg?v=10" playsinline preload="metadata" aria-label="Switzerland's Water Pulse, 2025"></video>
        <button type="button" id="btn-chat" class="chat-toggle" aria-expanded="false" aria-controls="chat" aria-label="Ask about the water">
          <svg class="icon-chat" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M5 6.4A2.4 2.4 0 0 1 7.4 4h9.2A2.4 2.4 0 0 1 19 6.4v6.7a2.4 2.4 0 0 1-2.4 2.4H12l-3.4 2.7c-.7.55-1.7.06-1.7-.8v-1.9H7.4A2.4 2.4 0 0 1 5 13.1V6.4Z"
            />
          </svg>
          <svg class="icon-close" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4Z" />
          </svg>
        </button>
        <section class="chat" id="chat" hidden>
          <div class="chat-head">
            <p class="chat-label">Ask the year</p>
            <button type="button" id="chat-close" aria-label="Close chat">×</button>
          </div>
          <div class="chat-log" id="chat-log" role="log" aria-live="polite"></div>
          <form class="ask" id="ask-form">
            <div class="ask-row">
              <label class="sr-only" for="ask-input">Question</label>
              <input id="ask-input" type="text" autocomplete="off" placeholder="Rhine on 15 June, or the peak day" />
              <button type="submit" aria-label="Send">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="currentColor" d="M4 12.2 19.2 4.8c.7-.3 1.4.4 1.1 1.1L13.6 20c-.3.8-1.4.7-1.6-.1l-1.6-6.1-6.1-1.6c-.8-.2-.9-1.3-.3-1.6Z" />
                </svg>
              </button>
            </div>
          </form>
        </section>
      </div>

      <section class="controls" aria-label="Timeline">
        <div class="control-row">
          <button type="button" id="play" class="play">Play</button>
          <p id="stamp" class="stamp">1 Jan 2025</p>
          <label class="calendar">
            <span>Calendar</span>
            <input id="calendar" type="date" min="2025-01-01" max="2025-12-31" value="2025-01-01" />
          </label>
        </div>
        <label class="slider">
          <span class="sr-only">Day of 2025</span>
          <input id="day" type="range" min="0" max="364" value="0" step="1" />
        </label>
        <div class="ticks" aria-hidden="true">
          <span style="left: 0">Jan</span>
          <span style="left: 49.7%">Jul</span>
          <span style="left: 91.8%">Dec</span>
        </div>
        <p class="headline"><span>Water leaving Switzerland</span> <strong id="total">—</strong></p>
        <p id="parts" class="parts"></p>
      </section>
    </main>

    <script src="app.js?v=11"></script>
    <script src="chat.js?v=5"></script>
  </body>
</html>
