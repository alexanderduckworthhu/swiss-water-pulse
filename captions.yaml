# Edit the sentences. The rules read fields the pipeline computes
# (alpine anomaly, Rhône anomaly, national anomaly, per-reach percentiles).
# The first matching season caption wins. Callouts are not hardcoded dates.

default: "A year of Swiss water, day by day"

seasons:
  - id: snowmelt
    months: [4, 5, 6]
    when: alpine_anomaly_above
    threshold: 0.12
    text: "Snowmelt: the Alps wake up"
  - id: glacier
    months: [7, 8, 9]
    when: rhone_anomaly_above
    threshold: 0.08
    text: "Glacier melt keeps the Rhône high"
  - id: autumn_low
    months: [9, 10, 11]
    when: national_anomaly_below
    threshold: -0.04
    text: "Autumn low flows"
  - id: winter
    months: [12, 1, 2, 3]
    when: always
    text: "Winter: snow holds the water back"
  - id: plateau
    months: [4, 5, 6, 7, 8, 9, 10]
    when: always
    text: "Rain on the Plateau, snow still high"

callouts:
  - id: flood
    when: reach_above_percentile
    percentile: 0.995
    min_area_km2: 400
    template: "Flood peak — {river} near {place}"
    max_simultaneous: 1
  - id: low
    when: reach_below_percentile
    percentile: 0.008
    min_area_km2: 800
    template: "Very low — {river}"
    max_simultaneous: 1
