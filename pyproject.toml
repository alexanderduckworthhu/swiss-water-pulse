[project]
name = "swiss-water-pulse"
version = "0.1.0"
description = "Every Swiss river, every day, drawn as a ribbon."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6",
  "xarray>=2024.1",
  "netCDF4>=1.6",
  "cdsapi>=0.7.7",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyogrio>=0.9",
  "rasterio>=1.4",
  "pyproj>=3.6",
  "requests>=2.31",
  "skia-python>=87",
  "pillow>=10",
  "pyarrow>=16",
]

[tool.uv]
package = false
